name: Android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint, assemble and publish locally
        run: >-
          ./gradlew :dialogplus:testDebugUnitTest
          :dialogplus:lint :dialogplus:lintRelease :app:lint :app:lintRelease
          :dialogplus:assembleRelease :dialogplus:assembleDebugAndroidTest
          :app:assembleDebug :app:assembleRelease :dialogplus:publishToMavenLocal
          -PlocalPublication -Dmaven.repo.local="$PWD/build/maven-local"
      - name: Inspect API, publication and README
        run: |
          python3 scripts/check-public-api.py
          python3 scripts/check-publication.py
          python3 scripts/check-readme.py
          git diff --check

  device-tests:
    name: Device tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [21, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: ./gradlew :dialogplus:connectedDebugAndroidTest
